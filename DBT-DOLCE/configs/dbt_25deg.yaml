# Master configuration for DBT DOLCE full fine-tuning (9p25d)

# Paths
data:
  raw_dir: "dataset/compressed"            # folder with .nrrd phantom files
  processed_dir: "dataset/processed_25deg" # HDF5 slices after preprocessing
  split_file: "dataset/split_25deg.json"   # patient-wise train/val/test lists

# Geometry
geometry:
  leap_cfg: "configs/leap_dbt_25deg.cfg"
  angle_range: 25        # total angular span (degrees)
  num_projections: 9     # number of projection angles
  sirt_iterations: 200   # SIRT iterations for conditioning
  image_size: 512        # spatial size of each 2D slice
  pixel_size_mm: 0.273   # isotropic voxel pitch (mm)

# Tissue attenuation reference (20 keV, units: cm^-1)
# Labels: 0=air, 1=adipose, 2=fibroglandular, 3=skin
# Hardcoded in data/preprocess.py; listed here for documentation only.
attenuation:
  air:            0.000
  adipose:        0.410
  fibroglandular: 0.780
  skin:           0.780

# Patient-wise data split ratios
# Used by data/preprocess.py --train_ratio / --val_ratio; listed here for reference.
split:
  train_ratio: 0.80
  val_ratio:   0.10
  test_ratio:  0.10
  seed: 42

# Model (DOLCE ConditionalModel).
# These MUST match the flags model512_all.pt was trained with, otherwise the
# checkpoint will not load. Verified against DOLCE evaluation_medicalCT.sh:
#   --attention_resolutions 32,16,8 --num_channels 128 --num_head_channels 64
#   --num_res_blocks 2 --resblock_updown True --use_fp16 True --dropout 0.0
# channel_mult is hardcoded to (0.5,1,1,2,2,4,4) inside condtion_create_model
# for image_size 512, so it is not configured here.
model:
  pretrained_ckpt: "model_zoo/model512_all.pt"
  image_size: 512
  num_channels: 128
  num_res_blocks: 2
  num_heads: 4
  num_head_channels: 64
  attention_resolutions: "32,16,8"
  resblock_updown: true
  dropout: 0.0
  # AMP fp16 (gates the UNet dtype + autocast/GradScaler in train.py). Safe
  # because gradient checkpointing is disabled in code; the fp16/checkpointing
  # dtype clash only happens during DOLCE's checkpoint recompute. fp16 also
  # halves activation memory, which is what lets batch_size 2 fit comfortably
  # on a single A100 80 GB GPU.
  use_fp16: true
  diffusion_steps: 1800
  noise_schedule: "linear"
  weighted_condition: false
  use_condition: "rls"
  # DOLCE's native image range. model512_all.pt was trained in [-1,1] (its
  # p_mean_variance clips pred_xstart to [-1,1], and base collapses to the
  # midpoint), so GT + conditioning are mapped to [-1,1] for training and
  # sampling; metrics are computed back in [0,1]. Set "01" only to reproduce the
  # earlier (mismatched) behaviour.
  data_range: "-11"
  # (Gradient checkpointing is disabled in code -- train.py neutralises DOLCE's
  # CheckpointFunction, which clashes with autocast. There is deliberately no
  # use_checkpoint knob here.)

# Training -- all 273M weights are fine-tuned (best domain adaptation for the
# medical-CT -> breast shift, since the frozen base collapses to its prior mean).
training:
  # Batch size (single A100 80 GB GPU). Gradient checkpointing is off, so
  # activation memory is high. Drop to 1 if you OOM.
  batch_size: 2
  num_workers: 4
  # Low LR: a full fine-tune of every weight must protect the pretrained init.
  lr: 2.0e-5
  weight_decay: 0.0
  ema_rate: 0.9999
  log_interval: 100
  # Every val_interval steps: validate the EMA model, append to progress.json,
  # refresh progress.png, and write checkpoint_latest.pt (always) +
  # checkpoint_best.pt (when val_loss improves). Only these two checkpoints are
  # kept -- they are overwritten, nnU-Net style, not accumulated per step.
  val_interval: 5000
  # Validation runs under no_grad, so use a larger batch and cap the number of
  # batches -- otherwise it crawls through the whole val set one sample at a
  # time. max_val_batches: 0 = full set.
  val_batch_size: 8
  max_val_batches: 50
  max_steps: 100000
  # Crash safety: if resume_checkpoint is empty and auto_resume is true, the
  # trainer picks up <output_dir>/checkpoint_latest.pt automatically (full
  # step/optimizer/history restore). Set auto_resume false, or point output_dir
  # somewhere new, to force a clean run. resume_checkpoint also accepts a bare
  # weights file (weights-only warm start).
  resume_checkpoint: ""
  auto_resume: true
  output_dir: "runs/dbt_25deg_full"

# Sampling / Inference
sampling:
  sampler: "ddpm"       # "ddpm" or "ddim"
  ddim_steps: 100       # only used when sampler=ddim
  eta: 0.0              # DDIM eta (0 = deterministic; cleaner with few steps)
  # Data-consistency arm: "none" | "prox" | "exact" (evaluate.py --dc overrides).
  # "prox" is the historical rho-prox baseline (kept as-published for the
  # comparison study); "exact" projects pred_x0 onto {x: Ax=y} through the
  # materialized operator.
  dc_mode: "prox"
  # Exact arm: materialized operator (build once with
  # scripts/materialize_operator.py) and the projection damping schedule.
  # gamma = 1 everywhere is the default (full projection, DDNM-style); a ramp
  # ending at 1 is the pre-designed fallback if early steps destabilize.
  # The final step always projects with gamma = 1 regardless.
  operator_npz: "runs/operator/A_25deg_512.npz"
  gamma_start: 1.0
  gamma_end: 1.0
  pinv_rcond: 1.0e-12   # dual-Gram pseudo-inverse eigenvalue cutoff (rel.)
  prox_solver: "cgrad"  # "cgrad" (parameter-free, default) or "apgm"
  # rho weights the prior term in argmin ||Ax-b||^2 + rho||x-x_hat||^2. For a
  # 9p25d operator A^T A is massively rank-deficient, so a TINY rho lets
  # the null space blow up (the old 5e-6/1e-4 zeroed the recon). Trust the prior:
  # start high, relax as the estimate firms up. NOTE: still needs a proper sweep
  # against the trained model -- evaluate with --no_prox first.
  rho_start: 1.0
  rho_end: 0.1

# Evaluation
evaluation:
  results_dir: "results/dbt_25deg"
